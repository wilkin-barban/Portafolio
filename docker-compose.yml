services:
  portfolio:
    build: .
    container_name: portfolio-web
    expose:
      - "80"
    environment:
      - NODE_ENV=production
      - PORT=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    depends_on:
      - portfolio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=UTC
    volumes:
      - ./nginx/sites:/etc/nginx/sites-templates:ro
      - ./nginx/default.http.conf:/etc/nginx/templates/default.http.conf:ro
      - ./nginx/default.https.conf:/etc/nginx/templates/default.https.conf:ro
      - ./nginx/select-config.sh:/docker-entrypoint.d/40-select-ssl-config.sh:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
      - edge-observations:/var/log/nginx/edge-observations
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --no-check-certificate -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    profiles: ["ssl"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  edge-observation-pruner:
    image: nginx:1.27-alpine
    container_name: portfolio-edge-observation-pruner
    network_mode: "none"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - edge-observations:/var/log/nginx/edge-observations
      - ./scripts/prune-edge-observation.sh:/usr/local/bin/prune-edge-observation.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/prune-edge-observation.sh"]

volumes:
  certbot-www:
  letsencrypt:
  edge-observations:
