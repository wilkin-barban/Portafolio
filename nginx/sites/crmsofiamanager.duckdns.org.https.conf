map $time_iso8601 $crm_edge_hour {
    default "nodate";
    "~^(\d{4}-\d{2}-\d{2}T\d{2})" $1;
}

map $uri $crm_edge_observe {
    default 0;
    "~^/functions/v1(?:/|$)" 1;
}

log_format crm_edge_observation 'time=$time_iso8601 method=$request_method status=$status upstream_status=$upstream_status count=1';

server {
    listen 80;
    listen [::]:80;

    server_name crmsofiamanager.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name crmsofiamanager.duckdns.org;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/crmsofiamanager.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmsofiamanager.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:CRM_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://crmsofiamanager.duckdns.org https://crmsofiamanager.duckdns.org" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Public Supabase data plane (Auth, REST, Storage, Realtime, Functions)
    location ~ ^/(auth|rest|storage|realtime|functions)/v1(?:/|$) {
        access_log /var/log/nginx/access.log main;
        access_log /var/log/nginx/edge-observations/crm-edge-$crm_edge_hour.log crm_edge_observation if=$crm_edge_observe;

        set $supabase_gw http://asados-supabase-kong:8000;
        proxy_pass $supabase_gw;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Evolution webhook
    location = /api/webhooks/evolution {
        client_max_body_size 10M;
        set $crm_web http://crm-sofia-web:3000;
        proxy_pass $crm_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Next.js Application
    location / {
        set $crm_web http://crm-sofia-web:3000;
        proxy_pass $crm_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
