server {
    server_tokens off;
    listen 80;
    listen [::]:80;

    server_name wilkinbarban-music.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name wilkinbarban-music.duckdns.org;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/wilkinbarban-music.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wilkinbarban-music.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64M;

    location / {
        set $navidrome_upstream http://music-navidrome:4533;
        proxy_pass $navidrome_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
