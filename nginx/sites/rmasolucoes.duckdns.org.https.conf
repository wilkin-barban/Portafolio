server {
    listen 80;
    server_name rmasolucoes.duckdns.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rmasolucoes.duckdns.org;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/rmasolucoes.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmasolucoes.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 25M;

    location / {
        set $rma_upstream http://rma-web:80;
        proxy_pass $rma_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
