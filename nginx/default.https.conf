# Engram Cloud HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name wilkinbarban-engram.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/wilkinbarban-engram.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wilkinbarban-engram.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16M;

    location / {
        proxy_pass http://engram-cloud:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }
}

