# OmniRoute HTTPS (OmniRoute 3.8.49 -> omniroute:20128)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name wilkinbarban-omniroute.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/wilkinbarban-omniroute.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wilkinbarban-omniroute.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    location / {
        proxy_pass http://omniroute:20128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
