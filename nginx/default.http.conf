# Private Music HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name wilkinbarban-music.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
